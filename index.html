<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda vocal</title>
<style>
:root{--bg:#f1f4ef;--card:#fff;--ink:#1d2b2a;--mute:#6b7a77;--acc:#2f6f5e;--rec:#d9482b;--line:#dbe2dc}
@media(prefers-color-scheme:dark){:root{--bg:#141b1a;--card:#1d2726;--ink:#e8eeec;--mute:#93a5a1;--acc:#5fb59c;--line:#2d3b39}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 28px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.rec{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#mic{flex:none;width:72px;height:72px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;cursor:pointer}
#mic.on{background:var(--rec);animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 14px rgba(217,72,43,.18)}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{font-size:14px;color:var(--mute);margin:0 0 20px}
#conf{display:none;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:16px;margin-bottom:24px}
#conf label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:16px}
h2{font:600 15px/1.3 system-ui,sans-serif;color:var(--mute);margin:24px 0 8px}
.ev{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.ev time{flex:none;width:92px;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600}
.ev span{flex:1;min-width:0;overflow-wrap:anywhere}
.ev button{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer}
.empty{color:var(--mute);padding:16px 0}
.top{display:flex;justify-content:space-between;align-items:end}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1>Agenda vocal</h1><p class="sub">Dites un événement, vérifiez, enregistrez.</p></div>
  <button class="btn" id="ics">Exporter .ics</button></div>

  <div class="rec">
    <button id="mic" aria-label="Dicter un événement">🎤</button>
    <input id="txt" placeholder="Ex. : Dentiste jeudi prochain à 14h30" aria-label="Texte de l'événement">
    <button class="btn main" id="go">Analyser</button>
  </div>
  <p class="hint" id="hint">Appuyez sur le micro et parlez. Vous pouvez aussi taper la phrase.</p>

  <section id="conf" aria-live="polite">
    <strong>Vérifiez l'événement</strong>
    <label for="f-t">Titre</label><input id="f-t">
    <label for="f-d">Début</label><input id="f-d" type="datetime-local">
    <label for="f-m">Durée (en heures, ex. 8 ou 1,5)</label><input id="f-m" type="number" min="0.25" step="0.25">
    <div class="row"><button class="btn main" id="save">Ajouter à l'agenda</button><button class="btn" id="cancel">Annuler</button></div>
  </section>

  <div id="list"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt=m=>m%60?`${m>=60?Math.floor(m/60)+' h ':''}${m%60} min`:`${m/60} h`;
const p2=n=>String(n).padStart(2,'0');
const toLocal=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;

/* ---------- Analyse de la phrase (règles simples, en français) ---------- */
function parse(input){
  let s=' '+input.trim()+' ', low=s.toLowerCase(), m;
  const now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const cut=re=>{s=s.replace(re,' ');low=low.replace(re,' ');};
  let dateFound=false;

  if(m=low.match(/apr[èe]s[- ]demain/)){d.setDate(d.getDate()+2);cut(/apr[èe]s[- ]demain/i);dateFound=true}
  else if(/\bdemain\b/.test(low)){d.setDate(d.getDate()+1);cut(/\bdemain\b/i);dateFound=true}
  else if(/aujourd'?hui|ce jour/.test(low)){cut(/aujourd'?hui|ce jour/i);dateFound=true}
  else if(m=low.match(/dans (\d+) (jours?|semaines?)/)){d.setDate(d.getDate()+(+m[1])*(m[2][0]=='s'?7:1));cut(/dans \d+ (jours?|semaines?)/i);dateFound=true}
  else if(m=low.match(new RegExp('\\b(?:le )?(\\d{1,2})(?:er)? ('+MOIS.join('|')+')(?: (\\d{4}))?'))){
    d.setMonth(MOIS.indexOf(m[2]),+m[1]);
    if(m[3])d.setFullYear(+m[3]); else if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1);
    cut(new RegExp('\\b(?:le )?\\d{1,2}(?:er)? ('+MOIS.join('|')+')(?: \\d{4})?','i'));dateFound=true}
  else if(m=low.match(new RegExp('\\b('+JOURS.join('|')+')( prochain)?'))){
    let diff=(JOURS.indexOf(m[1])-d.getDay()+7)%7; if(diff===0)diff=7;
    d.setDate(d.getDate()+diff);cut(new RegExp('\\b(ce |le )?('+JOURS.join('|')+')( prochain)?','i'));dateFound=true}
  else if(m=low.match(/\ble (\d{1,2})(?:er)?\b(?!\s*(h|:|heure))/)){
    d.setDate(+m[1]); if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setMonth(d.getMonth()+1);
    cut(/\ble \d{1,2}(?:er)?\b(?!\s*(h|:|heure))/i);dateFound=true}

  let dur=60;
  const cutStr=x=>{const i=low.indexOf(x);if(i<0)return;s=s.slice(0,i)+' '+s.slice(i+x.length);low=low.slice(0,i)+' '+low.slice(i+x.length)};
  const durRes=[
    /(?:pendant|dur[ée]e de|durant)\s*(\d+)\s*(heures?\b|h(?![a-zéè]))(?:\s*(?:et\s*)?(\d{2}))?/,
    /\bde\s*(\d+)\s*(heures?\b|h(?![a-zéè]))(?:\s*(?:et\s*)?(\d{2}))?(?!\s*\d)(?!\s*(?:à|a|-|jusqu'à)\s*\d{1,2}\s*(?:heures?\b|h(?![a-zéè])|:))/,
    /(?:(?:pendant|dur[ée]e de|durant|de)\s*)?(\d+)\s*(minutes?|min)\b/];
  for(const re of durRes){
    if(m=low.match(re)){dur=/^h/.test(m[2])?+m[1]*60+(+m[3]||0):+m[1];cutStr(m[0]);break}
  }
  let h=9,min=0,timeFound=false,range=null;
  const pm=/apr[èe]s-midi|du soir|de l'apr/.test(low);
  if(range=low.match(/(\d{1,2})\s*(?:heures?\b|h(?![a-zéè])|:)\s*(\d{2})?\s*(?:à|a|-|jusqu'à)\s*(\d{1,2})\s*(?:heures?\b|h(?![a-zéè])|:)\s*(\d{2})?/)){
    h=+range[1];min=+range[2]||0;timeFound=true;
    let end=(+range[3])*60+(+range[4]||0),st=h*60+min;
    if(end<=st)end+=1440;
    dur=end-st;
    cut(/(?:\bde |\bentre )?\d{1,2}\s*(?:heures?\b|h(?![a-zéè])|:)\s*(?:\d{2})?\s*(?:à|a|-|jusqu'à)\s*\d{1,2}\s*(?:heures?\b|h(?![a-zéè])|:)\s*(?:\d{2})?/i)}
  else if(/\bmidi\b/.test(low)){h=12;timeFound=true;cut(/\b[àa] midi\b|\bmidi\b/i)}
  else if(/\bminuit\b/.test(low)){h=0;timeFound=true;cut(/\b[àa] minuit\b|\bminuit\b/i)}
  else if(m=low.match(/(\d{1,2})\s*(?:heures?\b|h(?![a-zéè])|:)\s*(\d{2})?(?!\d)/)){
    h=+m[1];min=m[2]?+m[2]:0;timeFound=true;
    if(pm&&h<12)h+=12;
    cut(/\b[àa]?\s*\d{1,2}\s*(?:heures?\b|h(?![a-zéè])|:)\s*(\d{2})?(?!\d)(\s*(du matin|du soir|de l'apr[èe]s-midi))?/i);
  }
  cut(/\b(le |dans l')?(apr[èe]s-midi|matin|soir)\b/i);


  d.setHours(h,min,0,0);

  let title=s.replace(/\s+/g,' ').trim()
    .replace(/^(ajoute|ajouter|cr[ée]e|cr[ée]er|mets?|note|rappelle[- ]moi( de)?)\s+/i,'')
    .replace(/^(un|une|l')\s*(événement|evenement|rendez-vous|rdv)\s*(avec|chez|pour|:)?\s*/i,'')
    .replace(/^(à|le|de|pour|:|,)\s+/i,'').replace(/\s+(à|le|de|pour|,)$/i,'').trim();
  if(!title)title='Événement';
  title=title[0].toUpperCase()+title.slice(1);
  return {title,start:d,dur,dateFound,timeFound};
}

/* ---------- Stockage ---------- */
let events=[];
try{events=JSON.parse(localStorage.getItem('events')||'[]')}catch(e){}
const persist=()=>{try{localStorage.setItem('events',JSON.stringify(events))}catch(e){}};

function render(){
  const box=$('list');
  const upcoming=events.slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(!upcoming.length){box.innerHTML='<p class="empty">Aucun événement. Appuyez sur le micro pour en ajouter un.</p>';return}
  let html='',last='';
  for(const e of upcoming){
    const d=new Date(e.start);
    const day=`${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
    if(day!==last){html+=`<h2>${day}</h2>`;last=day}
    html+=`<div class="ev"><time>${p2(d.getHours())}h${p2(d.getMinutes())}</time><span></span><button data-id="${e.id}" aria-label="Supprimer">✕</button></div>`;
  }
  box.innerHTML=html;
  const spans=box.querySelectorAll('.ev span');
  upcoming.forEach((e,i)=>spans[i].textContent=`${e.title} (${fmt(e.dur)})`);
  box.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{events=events.filter(e=>e.id!=b.dataset.id);persist();render()});
}

/* ---------- Confirmation ---------- */
function showConfirm(r){
  $('f-t').value=r.title;$('f-d').value=toLocal(r.start);$('f-m').value=r.dur/60;
  $('conf').style.display='block';
  const miss=[];if(!r.dateFound)miss.push('la date');if(!r.timeFound)miss.push("l'heure");
  $('hint').textContent=miss.length?`Je n'ai pas trouvé ${miss.join(' ni ')} : vérifiez-${miss.length>1?'les':'la'} ci-dessous.`:'Vérifiez puis enregistrez.';
  $('f-t').focus();
}
$('go').onclick=()=>{const v=$('txt').value.trim();if(v)showConfirm(parse(v))};
$('txt').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('cancel').onclick=()=>{$('conf').style.display='none';$('hint').textContent='Annulé.'};
$('save').onclick=()=>{
  if(!$('f-d').value)return;
  events.push({id:Date.now(),title:$('f-t').value||'Événement',start:$('f-d').value,dur:Math.round((+$('f-m').value||1)*60)});
  persist();render();$('conf').style.display='none';$('txt').value='';$('hint').textContent='Événement ajouté.';
};

/* ---------- Reconnaissance vocale ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
$('mic').onclick=()=>{
  if(!SR){$('hint').textContent="La dictée n'est pas disponible ici. Ouvrez la page dans Chrome ou Edge, ou tapez la phrase.";return}
  if(listening){rec.stop();return}
  rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.continuous=false;
  let final='';
  rec.onstart=()=>{listening=true;$('mic').classList.add('on');$('hint').textContent='Je vous écoute…'};
  rec.onresult=ev=>{let t='';for(const r of ev.results){t+=r[0].transcript;if(r.isFinal)final=t}$('txt').value=t};
  rec.onerror=ev=>{$('hint').textContent=ev.error==='not-allowed'?"Micro refusé : autorisez-le dans la barre d'adresse du navigateur.":"Erreur de dictée ("+ev.error+"). Réessayez ou tapez la phrase."};
  rec.onend=()=>{listening=false;$('mic').classList.remove('on');const v=$('txt').value.trim();if(v&&final)showConfirm(parse(v))};
  rec.start();
};

/* ---------- Export .ics ---------- */
$('ics').onclick=()=>{
  const f=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
  let o='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Agenda vocal//FR\r\n';
  for(const e of events){const s=new Date(e.start),en=new Date(s.getTime()+e.dur*60000);
    o+=`BEGIN:VEVENT\r\nUID:${e.id}@agenda-vocal\r\nDTSTAMP:${f(new Date())}\r\nDTSTART:${f(s)}\r\nDTEND:${f(en)}\r\nSUMMARY:${e.title.replace(/[,;\n]/g,' ')}\r\nEND:VEVENT\r\n`}
  o+='END:VCALENDAR';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/calendar'}));a.download='agenda.ics';a.click();
};
render();
</script>
</body>
</html>
